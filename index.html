<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مصلحة الجمارك - استعلام القيمة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #0d3b66;
      --secondary-color: #f4d35e;
      --accent-color: #ee964b;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #2b2d42;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, var(--primary-color), #1b4965);
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .header-title h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    .header-title h2 {
      font-size: 1.1rem;
      font-weight: 400;
      opacity: 0.9;
    }

    main {
      flex: 1;
      max-width: 900px;
      width: 90%;
      margin: 30px auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .search-box {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    input {
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: var(--primary-color);
    }

    .btn-search {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
      grid-column: 1 / -1;
    }

    .btn-search:hover {
      background-color: #1b4965;
    }

    .results-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 12px 15px;
      text-align: right;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      background-color: #f1f5f9;
      color: var(--primary-color);
      font-weight: 700;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .loading, .no-data, .error-msg {
      text-align: center;
      padding: 20px;
      font-weight: 600;
    }

    .error-msg {
      color: #e63946;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>مصلحة الجمارك المصرية</h1>
      <h2>الإدارة العامة لجمارك الأسواق الحرة</h2>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="search-box">
        <div class="input-group">
          <label for="barcodeInput">الكود الدولي / البار كود:</label>
          <input type="text" id="barcodeInput" placeholder="ادخل كود الصنف...">
        </div>
        <div class="input-group">
          <label for="nameInput">اسم الصنف:</label>
          <input type="text" id="nameInput" placeholder="ادخل اسم الصنف...">
        </div>
        <button class="btn-search" onclick="searchData()">بحث</button>
      </div>
    </div>

    <div class="card">
      <div class="results-container" id="resultsContainer">
        <div class="no-data">قم بالبحث باستخدام الكود أو الاسم لعرض البيانات</div>
      </div>
    </div>
  </main>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbwsj1cb8K0ACPhMDT1VHpZ83jitBLJ7_PckZLutzPkWB1mhhdjbi9busGLSy6Tx3/exec";

    async function searchData() {
      const barcode = document.getElementById("barcodeInput").value.trim();
      const name = document.getElementById("nameInput").value.trim();
      const resultsContainer = document.getElementById("resultsContainer");

      if (!barcode && !name) {
        alert("يرجى إدخال الكود الدولي أو اسم الصنف للبحث!");
        return;
      }

      resultsContainer.innerHTML = '<div class="loading">جاري البحث في البيانات...</div>';

      try {
        const queryUrl = `${GOOGLE_SCRIPT_URL}?barcode=${encodeURIComponent(barcode)}&name=${encodeURIComponent(name)}`;
        const response = await fetch(queryUrl);
        const data = await response.json();

        if (!data.results || data.results.length === 0) {
          resultsContainer.innerHTML = '<div class="no-data">لم يتم العثور على نتائج مطابقة.</div>';
          return;
        }

        let tableHTML = '<table><thead><tr>';
        data.headers.forEach(header => {
          tableHTML += `<th>${header}</th>`;
        });
        tableHTML += '</tr></thead><tbody>';

        data.results.forEach(row => {
          tableHTML += '<tr>';
          row.forEach(cell => {
            tableHTML += `<td>${cell !== null ? cell : ''}</td>`;
          });
          tableHTML += '</tr>';
        });

        tableHTML += '</tbody></table>';
        resultsContainer.innerHTML = tableHTML;

      } catch (error) {
        console.error(error);
        resultsContainer.innerHTML = '<div class="error-msg">حدث خطأ أثناء جلب البيانات. تأكدي من إعدادات النشر والصلاحيات في Google Apps Script.</div>';
      }
    }
  </script>
</body>
</html>
